<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroVoigt Fitting GUI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh; 
            background: radial-gradient(ellipse at bottom, #050510 0%, #000000 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
          }
        
          /* Scrollbar Fix: Set a solid track color to hide the moving stars */
          ::-webkit-scrollbar {
              width: 10px;
              background: transparent;
          }
  
          ::-webkit-scrollbar-track {
              background: #0d0d26; /* Deep dark blue/purple to match background */
          }
  
          ::-webkit-scrollbar-thumb {
              background: #5b21b6; /* A purple color for the handle (e.g., Purple 700) */
              border-radius: 5px;
          }
          /* End Scrollbar Fix */
  
          /* Base template for a star layer */
          .stars, .stars2, .stars3 {
            position: fixed; /* Keep stars in viewport while scrolling */
            top: 0;
            left: 0;
            width: 100%; /* Cover the entire viewport width */
            height: 100%; /* Cover the entire viewport height */
            background: transparent;
            overflow: hidden; /* Contains the star animation to the viewport */
            pointer-events: none; /* Allows clicks to pass through to the content */
            transform: scale(1.5); /* Scale up for density */
          }
      
        /* Base template for a star layer */
        .stars, .stars2, .stars3 {
          position: absolute;
          top: 0;
          left: 0;
          width: 1px;
          height: 1px;
          background: transparent;
        }
      
        /* Create LOTS of stars using repeated box-shadows */
        .stars {
          box-shadow:
            50px 100px #fff, 80px 600px #fff, 130px 250px #fff, 160px 750px #fff, 200px 300px #fff,
            240px 900px #fff, 300px 500px #fff, 350px 50px #fff, 400px 850px #fff, 450px 150px #fff,
            500px 650px #fff, 550px 400px #fff, 600px 800px #fff, 650px 200px #fff, 700px 900px #fff,
            750px 300px #fff, 800px 100px #fff, 850px 500px #fff, 900px 700px #fff, 950px 400px #fff,
            1000px 200px #fff, 1050px 850px #fff, 1100px 350px #fff, 1150px 650px #fff, 1200px 150px #fff,
            1250px 900px #fff, 1300px 250px #fff, 1350px 700px #fff, 1400px 500px #fff, 1450px 800px #fff,
            1500px 100px #fff, 1550px 400px #fff, 1600px 900px #fff, 1650px 600px #fff, 1700px 350px #fff,
            1750px 750px #fff, 1800px 450px #fff, 1850px 650px #fff, 1900px 250px #fff, 1950px 850px #fff,
            2000px 500px #fff;
          animation: animStar 80s linear infinite;
        }
      
        .stars2 {
          box-shadow:
            25px 300px #bbb, 75px 900px #bbb, 125px 450px #bbb, 175px 650px #bbb, 225px 100px #bbb,
            275px 850px #bbb, 325px 550px #bbb, 375px 250px #bbb, 425px 700px #bbb, 475px 400px #bbb,
            525px 900px #bbb, 575px 600px #bbb, 625px 350px #bbb, 675px 800px #bbb, 725px 200px #bbb,
            775px 950px #bbb, 825px 150px #bbb, 875px 600px #bbb, 925px 400px #bbb, 975px 700px #bbb,
            1025px 300px #bbb, 1075px 900px #bbb, 1125px 150px #bbb, 1175px 550px #bbb, 1225px 750px #bbb,
            1275px 250px #bbb, 1325px 650px #bbb, 1375px 950px #bbb, 1425px 450px #bbb, 1475px 850px #bbb,
            1525px 100px #bbb, 1575px 750px #bbb, 1625px 600px #bbb, 1675px 350px #bbb, 1725px 800px #bbb,
            1775px 150px #bbb, 1825px 950px #bbb, 1875px 400px #bbb, 1925px 700px #bbb, 1975px 500px #bbb;
          animation: animStar 50s linear infinite;
        }
      
        .stars3 {
          box-shadow:
            10px 200px #fbfbfb, 60px 700px #fbfbfb, 110px 400px #fbfbfb, 160px 950px #fbfbfb, 210px 600px #fbfbfb,
            260px 300px #fbfbfb, 310px 800px #fbfbfb, 360px 500px #fbfbfb, 410px 900px #fbfbfb, 460px 250px #fbfbfb,
            510px 750px #fbfbfb, 560px 100px #fbfbfb, 610px 650px #fbfbfb, 660px 400px #fbfbfb, 710px 850px #fbfbfb,
            760px 150px #fbfbfb, 810px 950px #fbfbfb, 860px 350px #fbfbfb, 910px 650px #fbfbfb, 960px 550px #fbfbfb,
            1010px 100px #fbfbfb, 1060px 700px #fbfbfb, 1110px 250px #fbfbfb, 1160px 850px #fbfbfb, 1210px 400px #fbfbfb,
            1260px 900px #fbfbfb, 1310px 200px #fbfbfb, 1360px 600px #fbfbfb, 1410px 950px #fbfbfb, 1460px 300px #fbfbfb,
            1510px 800px #fbfbfb, 1560px 450px #fbfbfb, 1610px 850px #fbfbfb, 1660px 150px #fbfbfb, 1710px 700px #fbfbfb,
            1760px 500px #fbfbfb, 1810px 950px #fbfbfb, 1860px 350px #fbfbfb, 1910px 650px #fbfbfb, 1960px 400px #fbfbfb;
          animation: animStar 10s linear infinite;
        }
      
        @keyframes animStar {
          from { transform: translateY(0); }
          to { transform: translateY(-1000px); }
        }
      
        /* Twinkle glow effect */
        .twinkle::after {
          content: "";
          position: absolute;
          inset: 0;
          background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
          animation: twinkle 5s infinite ease-in-out alternate;
        }
      
        @keyframes twinkle {
          0% { opacity: 0.2; }
          100% { opacity: 0.8; }
        }
      </style>
      
      
      
</head>
<body>
    <div class="stars twinkle"></div>
    <div class="stars2 twinkle"></div>
    <div class="stars3 twinkle"></div>

    <div id="root"></div>

    <script type="text/babel">


        const { useState } = React;

        // Lucide React icons as SVG components
        const Play = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
        );

        const Plus = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const Trash2 = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                <line x1="10" y1="11" x2="10" y2="17"></line>
                <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        const Settings = () => (
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 1v6m0 6v6m8.66-15.66l-4.24 4.24m-4.24 4.24l-4.24 4.24m15.66-1.34l-6-1m-6-1l-6-1m1.34 8.66l4.24-4.24m4.24-4.24l4.24-4.24"></path>
            </svg>
        );

        const FileDown = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="12" y1="18" x2="12" y2="12"></line>
                <polyline points="9 15 12 18 15 15"></polyline>
            </svg>
        );

        function AstroVoigtGUI() {
            const [star, setStar] = useState("HD 183143");
            const [molecules, setMolecules] = useState(['13CH+_4032', '12CH+_4032']);
            const [fileNo, setFileNo] = useState(0);
            const [waveRange, setWaveRange] = useState([4231.5, 4233.5]);
            const [absorptionRange, setAbsorptionRange] = useState([4232.05, 4232.8]);
            const [speciesParams, setSpeciesParams] = useState({
                0: { b: [2, 2], N: [1e13/70, 1e13/70], v_rad: [-11, 4] },
                1: { b: [2, 2], N: [1e13, 1e13], v_rad: [-11, 4] }
            });

            const addMolecule = () => {
                setMolecules([...molecules, '']);
                const newIndex = Object.keys(speciesParams).length;
                setSpeciesParams({
                    ...speciesParams,
                    [newIndex]: { b: [2, 2], N: [1e13, 1e13], v_rad: [-11, 4] }
                });
            };

            const removeMolecule = (index) => {
                const newMolecules = molecules.filter((_, i) => i !== index);
                setMolecules(newMolecules);
                const newParams = { ...speciesParams };
                delete newParams[index];
                const reindexedParams = {};
                Object.keys(newParams).sort().forEach((key, i) => {
                    reindexedParams[i] = newParams[key];
                });
                setSpeciesParams(reindexedParams);
            };

            const updateMolecule = (index, value) => {
                const newMolecules = [...molecules];
                newMolecules[index] = value;
                setMolecules(newMolecules);
            };

            const updateSpeciesParam = (speciesIndex, param, valueIndex, value) => {
                const newParams = { ...speciesParams };
                newParams[speciesIndex][param][valueIndex] = parseFloat(value);
                setSpeciesParams(newParams);
            };

            const generatePythonCode = () => {
                let code = `#================================ USER input ================================
# which star you are looking?
star = "${star}"
#interested molecules for fitting?
molecule = [${molecules.map(m => `'${m}'`).join(', ')}]
# file number from the EDIBLES DR4 data set
file_no = ${fileNo}
# wavelength range for the fit
wave_range = [${waveRange[0]}, ${waveRange[1]}]
# absorption range
absorption_range = (${absorptionRange[0]}, ${absorptionRange[1]})
# Initial guess parameters
species_params = {
`;
                Object.keys(speciesParams).forEach(key => {
                    const params = speciesParams[key];
                    code += `${key}: {
    'b': [${params.b.join(', ')}],
    'N': [${params.N.join(', ')}],
    'v_rad': [${params.v_rad.join(', ')}]
  },
`;
                });
                code += `}
############### THIS IS FOR PLOTTING ###########
from main_run import astrovoigtfit_run, continuum_fit
import matplotlib.pyplot as plt

wave,continuum_normalized_flux ,flux, continuum = continuum_fit(star, molecule,file_no, wave_range, absorption_range)
plt.figure(figsize=(8, 8))
plt.subplot(2, 1, 1)
plt.plot(wave, flux, 'b-', label='Original Flux')
plt.plot(wave, continuum, 'r-', label='Continuum Fit')
plt.axvspan(absorption_range[0], absorption_range[1], color='gray', alpha=0.3, label='Absorption Region')
plt.xlabel('Wave')
plt.ylabel('Flux')
plt.legend()
plt.title('Continuum Fitting')

plt.subplot(2, 1, 2)
plt.plot(wave, continuum_normalized_flux, 'g-', label='Normalized Flux')
plt.axhline(1.0, color='k', linestyle='--', label='Continuum = 1.0')
plt.axvspan(absorption_range[0], absorption_range[1], color='gray', alpha=0.3)
plt.xlabel('Wavelength')
plt.ylabel('Normalized Flux')
plt.legend()
plt.title('Normalized Spectrum')
plt.show()

print("running the fitting model")
astrovoigtfit_run(star,molecule, wave_range,species_params,absorption_range,file_no)`;
                return code;
            };

            const downloadConfig = () => {
                const code = generatePythonCode();
                const blob = new Blob([code], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'astrovoigt_config.py';
                a.click();
                URL.revokeObjectURL(url);
            };

            const copyToClipboard = () => {
                const code = generatePythonCode();
                navigator.clipboard.writeText(code);
                alert('Python code copied to clipboard!');
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 p-6">
                    <div className="max-w-6xl mx-auto">
                        <div className="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 border border-white/20">
                            <div className="flex items-center justify-between mb-8">
                                <div>
                                    <h1 className="text-4xl font-bold text-white mb-2">AstroVoigt Fitting GUI</h1>
                                    <p className="text-purple-200">Configure parameters for spectral line fitting</p>
                                </div>
                                
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                                <div className="bg-white/5 rounded-xl p-6 border border-white/10">
                                    <h2 className="text-2xl font-semibold text-white mb-4 flex items-center gap-2">
                                        <div className="w-2 h-2 bg-purple-400 rounded-full"></div>
                                        Basic Parameters
                                    </h2>
                                    
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-purple-200 text-sm font-medium mb-2">Star Name</label>
                                            <input
                                                type="text"
                                                value={star}
                                                onChange={(e) => setStar(e.target.value)}
                                                className="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white placeholder-purple-300 focus:outline-none focus:ring-2 focus:ring-purple-400"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-purple-200 text-sm font-medium mb-2">File Number</label>
                                            <input
                                                type="number"
                                                value={fileNo}
                                                onChange={(e) => setFileNo(parseInt(e.target.value))}
                                                className="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-purple-400"
                                            />
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white/5 rounded-xl p-6 border border-white/10">
                                    <h2 className="text-2xl font-semibold text-white mb-4 flex items-center gap-2">
                                        <div className="w-2 h-2 bg-blue-400 rounded-full"></div>
                                        Wavelength Ranges
                                    </h2>
                                    
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-purple-200 text-sm font-medium mb-2">Wave Range</label>
                                            <div className="grid grid-cols-2 gap-2">
                                                <input
                                                    type="number"
                                                    step="0.1"
                                                    value={waveRange[0]}
                                                    onChange={(e) => setWaveRange([parseFloat(e.target.value), waveRange[1]])}
                                                    className="bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-400"
                                                    placeholder="Min"
                                                />
                                                <input
                                                    type="number"
                                                    step="0.1"
                                                    value={waveRange[1]}
                                                    onChange={(e) => setWaveRange([waveRange[0], parseFloat(e.target.value)])}
                                                    className="bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-400"
                                                    placeholder="Max"
                                                />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-purple-200 text-sm font-medium mb-2">Absorption Range</label>
                                            <div className="grid grid-cols-2 gap-2">
                                                <input
                                                    type="number"
                                                    step="0.01"
                                                    value={absorptionRange[0]}
                                                    onChange={(e) => setAbsorptionRange([parseFloat(e.target.value), absorptionRange[1]])}
                                                    className="bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-400"
                                                    placeholder="Min"
                                                />
                                                <input
                                                    type="number"
                                                    step="0.01"
                                                    value={absorptionRange[1]}
                                                    onChange={(e) => setAbsorptionRange([absorptionRange[0], parseFloat(e.target.value)])}
                                                    className="bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-400"
                                                    placeholder="Max"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white/5 rounded-xl p-6 border border-white/10 mb-8">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-2xl font-semibold text-white flex items-center gap-2">
                                        <div className="w-2 h-2 bg-green-400 rounded-full"></div>
                                        Molecules & Parameters
                                    </h2>
                                    <button
                                        onClick={addMolecule}
                                        className="flex items-center gap-2 bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg transition-colors"
                                    >
                                        <Plus />
                                        Add Molecule
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    {molecules.map((molecule, idx) => (
                                        <div key={idx} className="bg-white/5 rounded-lg p-4 border border-white/10">
                                            <div className="flex justify-between items-start mb-4">
                                                <div className="flex-1">
                                                    <label className="block text-purple-200 text-sm font-medium mb-2">
                                                        Molecule {idx + 1}
                                                    </label>
                                                    <input
                                                        type="text"
                                                        value={molecule}
                                                        onChange={(e) => updateMolecule(idx, e.target.value)}
                                                        className="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-green-400"
                                                        placeholder="e.g., 13CH+_4032"
                                                    />
                                                </div>
                                                <button
                                                    onClick={() => removeMolecule(idx)}
                                                    className="ml-2 p-2 text-red-400 hover:text-red-300 hover:bg-red-500/20 rounded-lg transition-colors"
                                                >
                                                    <Trash2 />
                                                </button>
                                            </div>

                                            {speciesParams[idx] && (
                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                    <div>
                                                        <label className="block text-purple-200 text-xs font-medium mb-2">
                                                            b (Gaussian Width)
                                                        </label>
                                                        <div className="grid grid-cols-2 gap-2">
                                                            <input
                                                                type="number"
                                                                step="0.1"
                                                                value={speciesParams[idx].b[0]}
                                                                onChange={(e) => updateSpeciesParam(idx, 'b', 0, e.target.value)}
                                                                className="bg-white/10 border border-white/20 rounded px-2 py-1 text-white text-sm focus:outline-none focus:ring-1 focus:ring-green-400"
                                                            />
                                                            <input
                                                                type="number"
                                                                step="0.1"
                                                                value={speciesParams[idx].b[1]}
                                                                onChange={(e) => updateSpeciesParam(idx, 'b', 1, e.target.value)}
                                                                className="bg-white/10 border border-white/20 rounded px-2 py-1 text-white text-sm focus:outline-none focus:ring-1 focus:ring-green-400"
                                                            />
                                                        </div>
                                                    </div>

                                                    <div>
                                                        <label className="block text-purple-200 text-xs font-medium mb-2">
                                                            N (Column Density)
                                                        </label>
                                                        <div className="grid grid-cols-2 gap-2">
                                                            <input
                                                                type="number"
                                                                step="any"
                                                                value={speciesParams[idx].N[0]}
                                                                onChange={(e) => updateSpeciesParam(idx, 'N', 0, e.target.value)}
                                                                className="bg-white/10 border border-white/20 rounded px-2 py-1 text-white text-sm focus:outline-none focus:ring-1 focus:ring-green-400"
                                                            />
                                                            <input
                                                                type="number"
                                                                step="any"
                                                                value={speciesParams[idx].N[1]}
                                                                onChange={(e) => updateSpeciesParam(idx, 'N', 1, e.target.value)}
                                                                className="bg-white/10 border border-white/20 rounded px-2 py-1 text-white text-sm focus:outline-none focus:ring-1 focus:ring-green-400"
                                                            />
                                                        </div>
                                                    </div>

                                                    <div>
                                                        <label className="block text-purple-200 text-xs font-medium mb-2">
                                                            v_rad (Radial Velocity)
                                                        </label>
                                                        <div className="grid grid-cols-2 gap-2">
                                                            <input
                                                                type="number"
                                                                step="0.1"
                                                                value={speciesParams[idx].v_rad[0]}
                                                                onChange={(e) => updateSpeciesParam(idx, 'v_rad', 0, e.target.value)}
                                                                className="bg-white/10 border border-white/20 rounded px-2 py-1 text-white text-sm focus:outline-none focus:ring-1 focus:ring-green-400"
                                                            />
                                                            <input
                                                                type="number"
                                                                step="0.1"
                                                                value={speciesParams[idx].v_rad[1]}
                                                                onChange={(e) => updateSpeciesParam(idx, 'v_rad', 1, e.target.value)}
                                                                className="bg-white/10 border border-white/20 rounded px-2 py-1 text-white text-sm focus:outline-none focus:ring-1 focus:ring-green-400"
                                                            />
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="flex gap-4 justify-center">
                                <button
                                    onClick={copyToClipboard}
                                    className="flex items-center gap-2 bg-purple-500 hover:bg-purple-600 text-white px-6 py-3 rounded-lg font-semibold transition-colors shadow-lg"
                                >
                                    <Play />
                                    Copy Python Code
                                </button>
                                <button
                                    onClick={downloadConfig}
                                    className="flex items-center gap-2 bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold transition-colors shadow-lg"
                                >
                                    <FileDown />
                                    Download Config
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<AstroVoigtGUI />, document.getElementById('root'));
    </script>
</body>
</html>
